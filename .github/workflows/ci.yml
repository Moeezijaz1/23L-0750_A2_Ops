name: CI
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t visionguard:ci .
      # Secrets (e.g. DagsHub token) live in Settings > Secrets and variables > Actions and are referenced as
      # ${{ secrets.NAME }}; they are encrypted, masked in logs, and must never be written in this file.
