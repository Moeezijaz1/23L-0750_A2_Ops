# Task 6.3 - web + database. Start: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NOTE: no `ports:` -> PostgreSQL is reachable only on Compose's internal network, as host "db"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy            # web starts only after Postgres accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      MODEL_PATH: /models/champion.keras
      THRESHOLD: ${THRESHOLD}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      INFERENCE_MODE: local
    volumes:
      - ./models:/models:ro                   # model mounted read-only: swap champion without rebuilding
    ports:
      - "5000:5000"

volumes:
  pgdata:
